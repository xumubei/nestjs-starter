minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

allowBuilds:
  '@nestjs/core': false
  '@scarf/scarf': false
  bufferutil: false
  es5-ext: false
  utf-8-validate: false

catalogs:
  dev:
    '@antfu/eslint-config': ^10.0.0
    '@types/amqplib': ^0.10.0
    '@types/node': ^24.0.0
    '@types/pg': ^8.23.1
    '@types/ws': ^8.18.0
    aedes: ^1.2.0
    eslint: ^10.14.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    tsc-watch: ^7.2.0
    typescript: ~6.0.3

  prod:
    '@fastify/static': ^10.1.10
    '@nestjs/common': 11.2.8
    '@nestjs/config': ^12.1.0
    '@nestjs/core': 11.2.8
    '@nestjs/jwt': ^12.0.3
    '@nestjs/platform-fastify': 11.2.8
    '@nestjs/schedule': ^6.0.0
    '@nestjs/swagger': ^11.4.7
    '@nestjs/throttler': ^6.7.1
    '@redis/client': ^6.3.1
    '@tdengine/websocket': ^3.2.2
    amqplib: ^0.10.9
    class-transformer: ^0.5.1
    class-validator: ^0.15.1
    fastify: 5.11.3
    kafkajs: ^2.2.4
    minio: ^8.0.0
    mqtt: ^5.16.1
    node-pg-migrate: ^9.0.0
    pg: ^8.23.1
    reflect-metadata: ^0.2.2
    rxjs: ^7.8.2
    ws: ^8.18.0
