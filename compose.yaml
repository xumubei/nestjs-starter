services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U starter -d starter]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    profiles: [integrations]
    ports:
      - '127.0.0.1:6380:6379'

  mqtt:
    image: eclipse-mosquitto:2
    profiles: [integrations]
    ports:
      - '127.0.0.1:18883:1883'
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    profiles: [integrations]
    ports:
      - '127.0.0.1:19092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  rabbitmq:
    image: rabbitmq:4-alpine
    profiles: [integrations]
    ports:
      - '127.0.0.1:15672:5672'
    environment:
      RABBITMQ_DEFAULT_USER: starter
      RABBITMQ_DEFAULT_PASS: starter

  tdengine:
    image: tdengine/tsdb:3.4.3.9
    hostname: tdengine
    profiles: [integrations]
    ports:
      - '127.0.0.1:16041:6041'
    environment:
      TAOS_FQDN: tdengine

  oss:
    image: adobe/s3mock:4.12.4
    profiles: [integrations]
    ports:
      - '127.0.0.1:9090:9090'

volumes:
  pgdata:
